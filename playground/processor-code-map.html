<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smaug processor.js — Code Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #111; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }

  .sidebar { width: 280px; min-width: 280px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #888; padding: 12px 16px 6px; }
  .sidebar-section { padding: 8px 16px; border-bottom: 1px solid #262626; }
  .sidebar-section:last-child { border-bottom: none; }

  .preset-btn { display: block; width: 100%; padding: 6px 10px; margin: 3px 0; background: #262626; border: 1px solid #333; border-radius: 4px; color: #ccc; font-size: 12px; cursor: pointer; text-align: left; }
  .preset-btn:hover { background: #333; }
  .preset-btn.active { background: #2a3a5c; border-color: #4a7adf; color: #8ab4f8; }

  .layer-toggle { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 12px; }
  .layer-toggle input { display: none; }
  .layer-swatch { width: 14px; height: 14px; border-radius: 3px; border: 2px solid transparent; }
  .layer-toggle input:checked + .layer-swatch { border-color: #fff; }

  .conn-toggle { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 12px; }
  .conn-toggle input { display: none; }
  .conn-line { width: 20px; height: 2px; }
  .conn-toggle input:checked + .conn-line { box-shadow: 0 0 4px currentColor; }

  .comment-item { padding: 6px 8px; margin: 3px 0; background: #262626; border-radius: 4px; font-size: 11px; position: relative; }
  .comment-item .target { color: #8ab4f8; font-weight: 600; font-size: 11px; }
  .comment-item .text { color: #aaa; margin-top: 2px; }
  .comment-item .del { position: absolute; top: 4px; right: 6px; background: none; border: none; color: #666; cursor: pointer; font-size: 14px; }
  .comment-item .del:hover { color: #f44; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .canvas-wrap { flex: 1; overflow: hidden; position: relative; }
  .canvas-wrap svg { width: 100%; height: 100%; }

  .zoom-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  .zoom-btn { width: 28px; height: 28px; background: #222; border: 1px solid #444; border-radius: 4px; color: #ccc; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { background: #333; }

  .legend { position: absolute; bottom: 10px; left: 10px; background: #1a1a1ae0; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }
  .legend-line { width: 20px; height: 0; border-top: 2px; }

  .prompt-area { background: #1a1a1a; border-top: 1px solid #333; padding: 10px 16px; max-height: 180px; overflow-y: auto; }
  .prompt-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .prompt-bar span { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .copy-btn { padding: 4px 12px; background: #2a3a5c; border: 1px solid #4a7adf; border-radius: 4px; color: #8ab4f8; font-size: 11px; cursor: pointer; }
  .copy-btn:hover { background: #3a4a6c; }
  .prompt-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: #bbb; white-space: pre-wrap; line-height: 1.5; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #000c; z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #222; border: 1px solid #444; border-radius: 8px; padding: 16px; width: 360px; }
  .modal h3 { font-size: 14px; margin-bottom: 4px; }
  .modal .subtitle { font-size: 11px; color: #888; margin-bottom: 10px; }
  .modal textarea { width: 100%; height: 80px; background: #1a1a1a; border: 1px solid #444; border-radius: 4px; color: #ddd; padding: 8px; font-size: 12px; font-family: inherit; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  .modal-actions button { padding: 5px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #444; }
  .modal-actions .cancel { background: #333; color: #ccc; }
  .modal-actions .save { background: #2a5a3c; border-color: #4aaf6a; color: #8aefaa; }

  /* Node tooltip */
  .node-tooltip { position: absolute; background: #222; border: 1px solid #555; border-radius: 6px; padding: 8px 12px; font-size: 11px; pointer-events: none; z-index: 50; max-width: 280px; display: none; }
  .node-tooltip .tt-title { font-weight: 600; color: #fff; }
  .node-tooltip .tt-sig { font-family: monospace; color: #8ab4f8; margin: 4px 0; font-size: 10px; }
  .node-tooltip .tt-desc { color: #aaa; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Views</h2>
  <div class="sidebar-section" id="presets"></div>

  <h2>Layers</h2>
  <div class="sidebar-section" id="layers"></div>

  <h2>Connections</h2>
  <div class="sidebar-section" id="connTypes"></div>

  <h2>Comments (<span id="commentCount">0</span>)</h2>
  <div class="sidebar-section" id="comments">
    <div style="font-size:11px;color:#666;">Click any function to add a comment</div>
  </div>
</div>

<div class="main">
  <div class="canvas-wrap">
    <svg id="canvas"></svg>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <button class="zoom-btn" onclick="zoomOut()">−</button>
      <button class="zoom-btn" onclick="zoomReset()" style="font-size:11px;">⟳</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="node-tooltip" id="tooltip"></div>
  </div>

  <div class="prompt-area">
    <div class="prompt-bar">
      <span>Prompt Output</span>
      <button class="copy-btn" onclick="copyPrompt()">Copy</button>
    </div>
    <div class="prompt-text" id="promptOutput"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="subtitle" id="modalSubtitle"></div>
    <textarea id="modalText" placeholder="Add your comment about this function..."></textarea>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveComment()">Save</button>
    </div>
  </div>
</div>

<script>
// ─── Data Model ───────────────────────────────────────────────

const LAYERS = {
  entry:    { label: 'Entry / Orchestrator', color: '#fbbf24', fill: '#422006' },
  fetch:    { label: 'Twitter Fetching',     color: '#3b82f6', fill: '#172554' },
  process:  { label: 'Link Processing',      color: '#a855f7', fill: '#3b0764' },
  content:  { label: 'Content Extraction',   color: '#10b981', fill: '#052e16' },
  state:    { label: 'State / Config',       color: '#f97316', fill: '#431407' },
  external: { label: 'External Services',    color: '#ef4444', fill: '#450a0a' },
};

const CONN_TYPES = {
  call:     { label: 'Function Call',   color: '#6b7280', dash: '' },
  io:       { label: 'External I/O',    color: '#ef4444', dash: '6,3' },
  data:     { label: 'Data Flow',       color: '#3b82f6', dash: '8,4' },
};

const nodes = [
  // Entry / Orchestrator
  { id: 'fetchAndPrepare', label: 'fetchAndPrepareBookmarks', sig: '(options) → {bookmarks, count}', desc: 'Main orchestrator: fetches tweets, expands links, extracts content, writes pending JSON', x: 480, y: 40, w: 210, h: 42, layer: 'entry' },

  // Twitter Fetching
  { id: 'fetchFromSource', label: 'fetchFromSource', sig: '(config, count, options) → tweets[]', desc: 'Dispatches to fetchBookmarks or fetchLikes based on config.source', x: 100, y: 140, w: 160, h: 38, layer: 'fetch' },
  { id: 'fetchFromFolders', label: 'fetchFromFolders', sig: '(config, count, options) → tweets[]', desc: 'Fetches from each configured bookmark folder, tags results', x: 350, y: 140, w: 170, h: 38, layer: 'fetch' },
  { id: 'fetchBookmarks', label: 'fetchBookmarks', sig: '(config, count, options) → tweets[]', desc: 'Calls bird CLI bookmarks command, handles pagination & thread expansion', x: 80, y: 230, w: 155, h: 38, layer: 'fetch' },
  { id: 'fetchLikes', label: 'fetchLikes', sig: '(config, count, options) → tweets[]', desc: 'Calls bird CLI likes command with thread expansion', x: 290, y: 230, w: 130, h: 38, layer: 'fetch' },
  { id: 'fetchTweet', label: 'fetchTweet', sig: '(config, tweetId) → tweet', desc: 'Fetches a single tweet by ID (for quote tweet context, parent replies)', x: 500, y: 230, w: 130, h: 38, layer: 'fetch' },
  { id: 'buildBirdEnv', label: 'buildBirdEnv', sig: '(config) → env{}', desc: 'Builds process.env with AUTH_TOKEN and CT0 for bird CLI', x: 80, y: 320, w: 140, h: 34, layer: 'fetch' },

  // Link Processing
  { id: 'groupThreadTweets', label: 'groupThreadTweets', sig: '(tweets, bookmarkedIds) → groups[]', desc: 'Groups flat tweet array by conversationId/threadRootId, identifies primary tweet per group', x: 620, y: 140, w: 175, h: 38, layer: 'process' },
  { id: 'expandTcoLink', label: 'expandTcoLink', sig: '(url, timeout?) → expandedUrl', desc: 'Follows t.co redirect via HEAD request to get final URL', x: 700, y: 230, w: 145, h: 38, layer: 'process' },
  { id: 'isLikelyMdFilename', label: 'isLikelyMdFilename', sig: '(expandedUrl, tweetText?) → {isFilename, reason}', desc: 'Detects auto-linked .md filenames (Moldova ccTLD). Uses allowlist + known filenames + catch-all.', x: 880, y: 140, w: 175, h: 38, layer: 'process' },
  { id: 'isPaywalled', label: 'isPaywalled', sig: '(url) → boolean', desc: 'Checks URL against PAYWALL_DOMAINS list', x: 900, y: 230, w: 130, h: 38, layer: 'process' },
  { id: 'stripQuerystring', label: 'stripQuerystring', sig: '(url) → url', desc: 'Removes query params from URL', x: 900, y: 300, w: 150, h: 34, layer: 'process' },

  // Content Extraction
  { id: 'fetchContent', label: 'fetchContent', sig: '(url, type, config) → content', desc: 'Dispatches to GitHub API or article fetch based on type, checks paywall', x: 620, y: 380, w: 145, h: 38, layer: 'content' },
  { id: 'fetchGitHubContent', label: 'fetchGitHubContent', sig: '(url) → {name, stars, readme, ...}', desc: 'Fetches repo metadata + README via GitHub REST API', x: 470, y: 460, w: 175, h: 38, layer: 'content' },
  { id: 'fetchArticleContent', label: 'fetchArticleContent', sig: '(url) → {text, paywalled}', desc: 'Fetches article HTML (up to 50KB), checks for paywall indicators', x: 720, y: 460, w: 175, h: 38, layer: 'content' },
  { id: 'fetchXArticleContent', label: 'fetchXArticleContent', sig: '(articleUrl, config, tweetId?) → article', desc: 'Fetches X article via bird CLI read/search, falls back to meta tag scraping', x: 280, y: 380, w: 185, h: 38, layer: 'content' },
  { id: 'searchForArticleTweet', label: 'searchForArticleTweet', sig: '(articleId, config) → tweet?', desc: 'Searches Twitter for original tweet that published an X article', x: 200, y: 460, w: 195, h: 38, layer: 'content' },
  { id: 'extractGitHubInfo', label: 'extractGitHubInfo', sig: '(url) → {owner, repo}', desc: 'Parses github.com/owner/repo from URL (private helper)', x: 470, y: 540, w: 160, h: 34, layer: 'content' },

  // State / Config
  { id: 'loadConfig', label: 'loadConfig', sig: '(configPath?) → config', desc: 'Loads smaug.config.json, merges with env vars and defaults (from config.js)', x: 100, y: 460, w: 130, h: 34, layer: 'state' },
  { id: 'loadState', label: 'loadState', sig: '(config) → state', desc: 'Reads .state/bookmarks-state.json', x: 100, y: 520, w: 120, h: 34, layer: 'state' },
  { id: 'saveState', label: 'saveState', sig: '(config, state) → void', desc: 'Writes updated state back to .state/bookmarks-state.json', x: 100, y: 574, w: 120, h: 34, layer: 'state' },
  { id: 'getExistingIds', label: 'getExistingBookmarkIds', sig: '(config) → Set<id>', desc: 'Scans bookmarks.md for already-archived tweet IDs', x: 280, y: 520, w: 190, h: 34, layer: 'state' },

  // External Services (not functions, but targets)
  { id: 'birdCli', label: 'bird CLI', sig: 'bookmarks | likes | read | search', desc: 'Twitter GraphQL API via bird CLI (@steipete/bird)', x: 80, y: 400, w: 100, h: 34, layer: 'external' },
  { id: 'githubApi', label: 'GitHub API', sig: 'repos/{owner}/{repo}', desc: 'GitHub REST API v3 for repo metadata and README', x: 470, y: 620, w: 110, h: 34, layer: 'external' },
  { id: 'httpFetch', label: 'HTTP fetch', sig: 'HEAD (t.co) / GET (articles)', desc: 'Native fetch() for URL expansion and article content', x: 720, y: 540, w: 110, h: 34, layer: 'external' },
];

const connections = [
  // fetchAndPrepareBookmarks calls
  { from: 'fetchAndPrepare', to: 'fetchFromSource', type: 'call' },
  { from: 'fetchAndPrepare', to: 'fetchFromFolders', type: 'call' },
  { from: 'fetchAndPrepare', to: 'groupThreadTweets', type: 'call' },
  { from: 'fetchAndPrepare', to: 'expandTcoLink', type: 'call' },
  { from: 'fetchAndPrepare', to: 'isLikelyMdFilename', type: 'call' },
  { from: 'fetchAndPrepare', to: 'fetchContent', type: 'call' },
  { from: 'fetchAndPrepare', to: 'fetchXArticleContent', type: 'call' },
  { from: 'fetchAndPrepare', to: 'fetchTweet', type: 'call' },
  { from: 'fetchAndPrepare', to: 'getExistingIds', type: 'call' },
  { from: 'fetchAndPrepare', to: 'loadConfig', type: 'call' },
  { from: 'fetchAndPrepare', to: 'loadState', type: 'call' },
  { from: 'fetchAndPrepare', to: 'saveState', type: 'call' },

  // Fetching sub-calls
  { from: 'fetchFromSource', to: 'fetchBookmarks', type: 'call' },
  { from: 'fetchFromSource', to: 'fetchLikes', type: 'call' },
  { from: 'fetchFromFolders', to: 'fetchBookmarks', type: 'call' },
  { from: 'fetchBookmarks', to: 'buildBirdEnv', type: 'call' },
  { from: 'fetchLikes', to: 'buildBirdEnv', type: 'call' },
  { from: 'fetchTweet', to: 'buildBirdEnv', type: 'call' },

  // Content extraction sub-calls
  { from: 'fetchContent', to: 'fetchGitHubContent', type: 'call' },
  { from: 'fetchContent', to: 'fetchArticleContent', type: 'call' },
  { from: 'fetchContent', to: 'isPaywalled', type: 'call' },
  { from: 'fetchGitHubContent', to: 'extractGitHubInfo', type: 'call' },
  { from: 'fetchXArticleContent', to: 'searchForArticleTweet', type: 'call' },
  { from: 'fetchXArticleContent', to: 'buildBirdEnv', type: 'call' },

  // External I/O
  { from: 'fetchBookmarks', to: 'birdCli', type: 'io', label: 'execSync' },
  { from: 'fetchLikes', to: 'birdCli', type: 'io', label: 'execSync' },
  { from: 'fetchTweet', to: 'birdCli', type: 'io', label: 'execSync' },
  { from: 'searchForArticleTweet', to: 'birdCli', type: 'io', label: 'execSync' },
  { from: 'fetchXArticleContent', to: 'birdCli', type: 'io', label: 'execSync' },
  { from: 'fetchGitHubContent', to: 'githubApi', type: 'io', label: 'fetch' },
  { from: 'fetchArticleContent', to: 'httpFetch', type: 'io', label: 'fetch' },
  { from: 'expandTcoLink', to: 'httpFetch', type: 'io', label: 'HEAD' },

  // Data flow
  { from: 'fetchFromSource', to: 'fetchAndPrepare', type: 'data', label: 'tweets[]' },
  { from: 'fetchFromFolders', to: 'fetchAndPrepare', type: 'data', label: 'tweets[]' },
  { from: 'groupThreadTweets', to: 'fetchAndPrepare', type: 'data', label: 'groups[]' },
  { from: 'expandTcoLink', to: 'fetchAndPrepare', type: 'data', label: 'expandedUrl' },
  { from: 'isLikelyMdFilename', to: 'fetchAndPrepare', type: 'data', label: '{isFilename}' },
  { from: 'fetchContent', to: 'fetchAndPrepare', type: 'data', label: 'content' },
];

// ─── State ────────────────────────────────────────────────────

const state = {
  layers: {},
  connTypes: {},
  comments: [],
  zoom: 1,
  panX: 0, panY: 0,
  activePreset: 'full',
  modalNode: null,
};

// Initialize toggles
Object.keys(LAYERS).forEach(k => state.layers[k] = true);
Object.keys(CONN_TYPES).forEach(k => state.connTypes[k] = true);

const PRESETS = {
  full: { label: 'Full System', layers: ['entry','fetch','process','content','state','external'], conns: ['call','io','data'] },
  fetch: { label: 'Twitter Fetching', layers: ['entry','fetch','external'], conns: ['call','io'] },
  links: { label: 'Link Processing', layers: ['entry','process','content','external'], conns: ['call','io','data'] },
  mdfilter: { label: '.md Filename Filter', layers: ['entry','process'], conns: ['call','data'] },
  dataflow: { label: 'Data Flow Only', layers: ['entry','fetch','process','content','state'], conns: ['data'] },
};

// ─── Rendering ────────────────────────────────────────────────

const svg = document.getElementById('canvas');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}

function clearSvg() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function nodeCenter(n) {
  return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
}

function drawConnection(conn) {
  const fromNode = nodes.find(n => n.id === conn.from);
  const toNode = nodes.find(n => n.id === conn.to);
  if (!fromNode || !toNode) return;
  if (!state.layers[fromNode.layer] || !state.layers[toNode.layer]) return;

  const ct = CONN_TYPES[conn.type];
  const from = nodeCenter(fromNode);
  const to = nodeCenter(toNode);

  // Calculate connection points at node edges
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const angle = Math.atan2(dy, dx);

  // Start/end at edge of boxes
  const startX = from.x + Math.cos(angle) * (fromNode.w / 2 + 2);
  const startY = from.y + Math.sin(angle) * (fromNode.h / 2 + 2);
  const endX = to.x - Math.cos(angle) * (toNode.w / 2 + 8);
  const endY = to.y - Math.sin(angle) * (toNode.h / 2 + 8);

  // Curved path
  const midX = (startX + endX) / 2;
  const midY = (startY + endY) / 2;
  const cx = midX + (endY - startY) * 0.15;
  const cy = midY - (endX - startX) * 0.15;

  const markerId = `arrow-${conn.type}`;
  const path = el('path', {
    d: `M${startX},${startY} Q${cx},${cy} ${endX},${endY}`,
    fill: 'none',
    stroke: ct.color,
    'stroke-width': conn.type === 'data' ? 1.5 : 1.2,
    'stroke-dasharray': ct.dash || 'none',
    'marker-end': `url(#${markerId})`,
    opacity: 0.5,
  });

  // Label
  if (conn.label) {
    const lx = (startX + endX) / 2 + (endY - startY) * 0.08;
    const ly = (startY + endY) / 2 - (endX - startX) * 0.08;
    el('text', { x: lx, y: ly, fill: ct.color, 'font-size': '9', 'text-anchor': 'middle', opacity: 0.7 }).textContent = conn.label;
  }
}

function drawNode(node) {
  const hasComment = state.comments.some(c => c.target === node.id);
  const layerInfo = LAYERS[node.layer];
  const g = el('g', { class: 'node', 'data-id': node.id, cursor: 'pointer' });

  // Shadow
  el('rect', {
    x: node.x + 2, y: node.y + 2, width: node.w, height: node.h,
    rx: 6, fill: '#000', opacity: 0.3
  }, g);

  // Box
  el('rect', {
    x: node.x, y: node.y, width: node.w, height: node.h,
    rx: 6,
    fill: layerInfo.fill,
    stroke: hasComment ? '#fbbf24' : layerInfo.color,
    'stroke-width': hasComment ? 2.5 : 1.2,
  }, g);

  // Comment indicator
  if (hasComment) {
    el('circle', { cx: node.x + node.w - 6, cy: node.y + 6, r: 5, fill: '#fbbf24' }, g);
    el('text', { x: node.x + node.w - 6, y: node.y + 9, fill: '#000', 'font-size': '8', 'text-anchor': 'middle', 'font-weight': 'bold' }, g).textContent = '!';
  }

  // Label
  const label = el('text', {
    x: node.x + node.w / 2, y: node.y + node.h / 2 + (node.layer === 'external' ? 1 : -2),
    fill: '#eee', 'font-size': node.layer === 'external' ? '11' : '11',
    'text-anchor': 'middle', 'font-weight': '600',
    'font-family': "'SF Mono','Fira Code',monospace"
  }, g);
  // Truncate long names
  const displayLabel = node.label.length > 24 ? node.label.slice(0, 22) + '…' : node.label;
  label.textContent = displayLabel;

  // Subtitle for non-external
  if (node.layer !== 'external') {
    el('text', {
      x: node.x + node.w / 2, y: node.y + node.h / 2 + 11,
      fill: '#888', 'font-size': '9', 'text-anchor': 'middle',
      'font-family': "'SF Mono','Fira Code',monospace"
    }, g).textContent = node.sig.length > 35 ? node.sig.slice(0, 33) + '…' : node.sig;
  }

  // Hover + click
  g.addEventListener('mouseenter', (e) => showTooltip(node, e));
  g.addEventListener('mouseleave', hideTooltip);
  g.addEventListener('click', () => openModal(node));
}

function render() {
  clearSvg();

  // Defs for arrowheads
  const defs = el('defs');
  for (const [type, ct] of Object.entries(CONN_TYPES)) {
    const marker = el('marker', {
      id: `arrow-${type}`, markerWidth: '8', markerHeight: '6', refX: '7', refY: '3', orient: 'auto'
    }, defs);
    el('polygon', { points: '0 0, 8 3, 0 6', fill: ct.color }, marker);
  }

  // Transform group for zoom/pan
  const g = el('g', { transform: `translate(${state.panX},${state.panY}) scale(${state.zoom})` });

  // Temporarily redirect el() parent
  const origSvg = svg;
  const elInGroup = (tag, attrs = {}) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    g.appendChild(e);
    return e;
  };

  // Draw connections first (under nodes)
  for (const conn of connections) {
    if (!state.connTypes[conn.type]) continue;
    const fromNode = nodes.find(n => n.id === conn.from);
    const toNode = nodes.find(n => n.id === conn.to);
    if (!fromNode || !toNode) continue;
    if (!state.layers[fromNode.layer] || !state.layers[toNode.layer]) continue;

    const ct = CONN_TYPES[conn.type];
    const from = nodeCenter(fromNode);
    const to = nodeCenter(toNode);
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const angle = Math.atan2(dy, dx);
    const startX = from.x + Math.cos(angle) * (fromNode.w / 2 + 2);
    const startY = from.y + Math.sin(angle) * (fromNode.h / 2 + 2);
    const endX = to.x - Math.cos(angle) * (toNode.w / 2 + 8);
    const endY = to.y - Math.sin(angle) * (toNode.h / 2 + 8);
    const cx = (startX + endX) / 2 + (endY - startY) * 0.15;
    const cy = (startY + endY) / 2 - (endX - startX) * 0.15;

    elInGroup('path', {
      d: `M${startX},${startY} Q${cx},${cy} ${endX},${endY}`,
      fill: 'none', stroke: ct.color,
      'stroke-width': conn.type === 'data' ? 1.5 : 1.2,
      'stroke-dasharray': ct.dash || 'none',
      'marker-end': `url(#arrow-${conn.type})`,
      opacity: 0.45,
    });
    if (conn.label) {
      const lx = (startX + endX) / 2 + (endY - startY) * 0.08;
      const ly = (startY + endY) / 2 - (endX - startX) * 0.08;
      const t = elInGroup('text', { x: lx, y: ly, fill: ct.color, 'font-size': '9', 'text-anchor': 'middle', opacity: 0.6 });
      t.textContent = conn.label;
    }
  }

  // Draw nodes
  for (const node of nodes) {
    if (!state.layers[node.layer]) continue;
    const hasComment = state.comments.some(c => c.target === node.id);
    const layerInfo = LAYERS[node.layer];
    const ng = elInGroup('g', { cursor: 'pointer' });

    elInGroup.call(null);
    const rect = document.createElementNS(NS, 'rect');
    // Build node manually inside g
    const shadow = document.createElementNS(NS, 'rect');
    shadow.setAttribute('x', node.x + 2); shadow.setAttribute('y', node.y + 2);
    shadow.setAttribute('width', node.w); shadow.setAttribute('height', node.h);
    shadow.setAttribute('rx', 6); shadow.setAttribute('fill', '#000'); shadow.setAttribute('opacity', 0.3);
    ng.appendChild(shadow);

    const box = document.createElementNS(NS, 'rect');
    box.setAttribute('x', node.x); box.setAttribute('y', node.y);
    box.setAttribute('width', node.w); box.setAttribute('height', node.h);
    box.setAttribute('rx', 6);
    box.setAttribute('fill', layerInfo.fill);
    box.setAttribute('stroke', hasComment ? '#fbbf24' : layerInfo.color);
    box.setAttribute('stroke-width', hasComment ? 2.5 : 1.2);
    ng.appendChild(box);

    if (hasComment) {
      const ci = document.createElementNS(NS, 'circle');
      ci.setAttribute('cx', node.x + node.w - 6); ci.setAttribute('cy', node.y + 6);
      ci.setAttribute('r', 5); ci.setAttribute('fill', '#fbbf24');
      ng.appendChild(ci);
      const ct2 = document.createElementNS(NS, 'text');
      ct2.setAttribute('x', node.x + node.w - 6); ct2.setAttribute('y', node.y + 9);
      ct2.setAttribute('fill', '#000'); ct2.setAttribute('font-size', '8');
      ct2.setAttribute('text-anchor', 'middle'); ct2.setAttribute('font-weight', 'bold');
      ct2.textContent = '!'; ng.appendChild(ct2);
    }

    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', node.x + node.w / 2);
    label.setAttribute('y', node.y + node.h / 2 + (node.layer === 'external' ? 1 : -2));
    label.setAttribute('fill', '#eee'); label.setAttribute('font-size', '11');
    label.setAttribute('text-anchor', 'middle'); label.setAttribute('font-weight', '600');
    label.setAttribute('font-family', "'SF Mono','Fira Code',monospace");
    const dl = node.label.length > 24 ? node.label.slice(0, 22) + '…' : node.label;
    label.textContent = dl; ng.appendChild(label);

    if (node.layer !== 'external') {
      const sub = document.createElementNS(NS, 'text');
      sub.setAttribute('x', node.x + node.w / 2);
      sub.setAttribute('y', node.y + node.h / 2 + 11);
      sub.setAttribute('fill', '#888'); sub.setAttribute('font-size', '9');
      sub.setAttribute('text-anchor', 'middle');
      sub.setAttribute('font-family', "'SF Mono','Fira Code',monospace");
      sub.textContent = node.sig.length > 35 ? node.sig.slice(0, 33) + '…' : node.sig;
      ng.appendChild(sub);
    }

    ng.addEventListener('mouseenter', (e) => showTooltip(node, e));
    ng.addEventListener('mouseleave', hideTooltip);
    ng.addEventListener('click', () => openModal(node));
    g.appendChild(ng);
  }

  updatePrompt();
}

// ─── Tooltip ──────────────────────────────────────────────────

const tooltip = document.getElementById('tooltip');
function showTooltip(node, event) {
  tooltip.style.display = 'block';
  tooltip.innerHTML = `
    <div class="tt-title">${node.label}</div>
    <div class="tt-sig">${node.sig}</div>
    <div class="tt-desc">${node.desc}</div>
  `;
  const rect = document.querySelector('.canvas-wrap').getBoundingClientRect();
  tooltip.style.left = (event.clientX - rect.left + 12) + 'px';
  tooltip.style.top = (event.clientY - rect.top + 12) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

// ─── Modal ────────────────────────────────────────────────────

const modal = document.getElementById('modal');
function openModal(node) {
  state.modalNode = node;
  document.getElementById('modalTitle').textContent = node.label;
  document.getElementById('modalSubtitle').textContent = `${node.sig} — ${node.desc}`;
  const existing = state.comments.find(c => c.target === node.id);
  document.getElementById('modalText').value = existing ? existing.text : '';
  modal.classList.add('show');
  document.getElementById('modalText').focus();
}
function closeModal() { modal.classList.remove('show'); state.modalNode = null; }
function saveComment() {
  const text = document.getElementById('modalText').value.trim();
  if (!text) { closeModal(); return; }
  const existing = state.comments.findIndex(c => c.target === state.modalNode.id);
  if (existing >= 0) {
    state.comments[existing].text = text;
  } else {
    state.comments.push({ id: Date.now(), target: state.modalNode.id, targetLabel: state.modalNode.label, text });
  }
  closeModal();
  renderComments();
  render();
}
function deleteComment(id) {
  state.comments = state.comments.filter(c => c.id !== id);
  renderComments();
  render();
}

// ─── Zoom ─────────────────────────────────────────────────────

function zoomIn() { state.zoom = Math.min(state.zoom * 1.2, 3); render(); }
function zoomOut() { state.zoom = Math.max(state.zoom / 1.2, 0.3); render(); }
function zoomReset() { state.zoom = 1; state.panX = 0; state.panY = 0; render(); }

// Pan via drag
let isPanning = false, panStart = {};
document.querySelector('.canvas-wrap').addEventListener('mousedown', (e) => {
  if (e.target.closest('g[cursor]')) return;
  isPanning = true; panStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
});
document.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  state.panX = e.clientX - panStart.x;
  state.panY = e.clientY - panStart.y;
  render();
});
document.addEventListener('mouseup', () => { isPanning = false; });

// ─── Sidebar Controls ────────────────────────────────────────

function buildPresets() {
  const el = document.getElementById('presets');
  for (const [key, preset] of Object.entries(PRESETS)) {
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (key === state.activePreset ? ' active' : '');
    btn.textContent = preset.label;
    btn.onclick = () => applyPreset(key);
    el.appendChild(btn);
  }
}

function applyPreset(key) {
  const preset = PRESETS[key];
  state.activePreset = key;
  for (const k of Object.keys(LAYERS)) state.layers[k] = preset.layers.includes(k);
  for (const k of Object.keys(CONN_TYPES)) state.connTypes[k] = preset.conns.includes(k);
  updateToggles();
  render();
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#presets button:nth-child(${Object.keys(PRESETS).indexOf(key) + 1})`).classList.add('active');
}

function buildLayers() {
  const el = document.getElementById('layers');
  for (const [key, layer] of Object.entries(LAYERS)) {
    const label = document.createElement('label');
    label.className = 'layer-toggle';
    label.innerHTML = `<input type="checkbox" data-layer="${key}" ${state.layers[key] ? 'checked' : ''}>
      <span class="layer-swatch" style="background:${layer.fill};border-color:${state.layers[key] ? layer.color : 'transparent'}"></span>
      ${layer.label}`;
    label.querySelector('input').onchange = (e) => {
      state.layers[key] = e.target.checked;
      state.activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      updateSwatchBorders();
      render();
    };
    el.appendChild(label);
  }
}

function buildConnTypes() {
  const el = document.getElementById('connTypes');
  for (const [key, ct] of Object.entries(CONN_TYPES)) {
    const label = document.createElement('label');
    label.className = 'conn-toggle';
    label.innerHTML = `<input type="checkbox" data-conn="${key}" ${state.connTypes[key] ? 'checked' : ''}>
      <span class="conn-line" style="background:${ct.color};border-top:2px ${ct.dash ? 'dashed' : 'solid'} ${ct.color}"></span>
      ${ct.label}`;
    label.querySelector('input').onchange = (e) => {
      state.connTypes[key] = e.target.checked;
      state.activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      render();
    };
    el.appendChild(label);
  }
}

function updateToggles() {
  document.querySelectorAll('[data-layer]').forEach(cb => { cb.checked = state.layers[cb.dataset.layer]; });
  document.querySelectorAll('[data-conn]').forEach(cb => { cb.checked = state.connTypes[cb.dataset.conn]; });
  updateSwatchBorders();
}

function updateSwatchBorders() {
  document.querySelectorAll('.layer-toggle').forEach(label => {
    const cb = label.querySelector('input');
    const sw = label.querySelector('.layer-swatch');
    const layer = LAYERS[cb.dataset.layer];
    sw.style.borderColor = cb.checked ? layer.color : 'transparent';
  });
}

function renderComments() {
  const el = document.getElementById('comments');
  document.getElementById('commentCount').textContent = state.comments.length;
  if (state.comments.length === 0) {
    el.innerHTML = '<div style="font-size:11px;color:#666;">Click any function to add a comment</div>';
    return;
  }
  el.innerHTML = state.comments.map(c => `
    <div class="comment-item">
      <div class="target">${c.targetLabel}</div>
      <div class="text">${c.text}</div>
      <button class="del" onclick="deleteComment(${c.id})">×</button>
    </div>
  `).join('');
}

// ─── Prompt Output ────────────────────────────────────────────

function updatePrompt() {
  const out = document.getElementById('promptOutput');
  const visibleLayers = Object.entries(state.layers).filter(([,v]) => v).map(([k]) => LAYERS[k].label);

  let parts = [];
  parts.push(`This is the processor.js code map for Smaug (src/processor.js), showing: ${visibleLayers.join(', ')}.`);

  if (state.comments.length > 0) {
    parts.push('');
    parts.push('Feedback on specific functions:');
    for (const c of state.comments) {
      parts.push('');
      parts.push(`**${c.targetLabel}**:`);
      parts.push(c.text);
    }
  }

  out.textContent = parts.join('\n');
}

function copyPrompt() {
  const text = document.getElementById('promptOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// ─── Legend ───────────────────────────────────────────────────

function buildLegend() {
  const el = document.getElementById('legend');
  let html = '<div style="font-weight:600;margin-bottom:4px;font-size:11px;">Layers</div>';
  for (const [, layer] of Object.entries(LAYERS)) {
    html += `<div class="legend-item"><span class="legend-swatch" style="background:${layer.fill};border:1px solid ${layer.color}"></span>${layer.label}</div>`;
  }
  html += '<div style="font-weight:600;margin:6px 0 4px;font-size:11px;">Connections</div>';
  for (const [, ct] of Object.entries(CONN_TYPES)) {
    html += `<div class="legend-item"><span style="display:inline-block;width:20px;border-top:2px ${ct.dash ? 'dashed' : 'solid'} ${ct.color}"></span>${ct.label}</div>`;
  }
  el.innerHTML = html;
}

// ─── Keyboard ─────────────────────────────────────────────────

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '+' || e.key === '=') zoomIn();
  if (e.key === '-') zoomOut();
  if (e.key === '0') zoomReset();
});

// Enter key in modal saves
document.getElementById('modalText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveComment(); }
});

// Mouse wheel zoom
document.querySelector('.canvas-wrap').addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.deltaY < 0) { state.zoom = Math.min(state.zoom * 1.08, 3); }
  else { state.zoom = Math.max(state.zoom / 1.08, 0.3); }
  render();
}, { passive: false });

// ─── Init ─────────────────────────────────────────────────────

buildPresets();
buildLayers();
buildConnTypes();
buildLegend();
render();

</script>
</body>
</html>
